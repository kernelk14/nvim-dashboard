name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.10.4

      - name: Check out the workbench
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: kernelk14/nvim-workbench
          path: nvim-workbench

      - name: Run the tests
        run: make test
        env:
          NEO_CORE_PATH: ${{ github.workspace }}/nvim-workbench
